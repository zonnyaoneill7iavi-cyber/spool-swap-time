          at: /tmp/reader2
      - run:
          name: Halt upstream reader
          command: |
            cat /tmp/reader2/tmp-8af3
      - run:
          name: Get project
          command: git clone --depth 3 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: zcat package-pieces.tgz | tar xvf -
      - run:
          name: Index artifacts
          command: uname -a
      - run:
          command: "$PWD/guest-stage"
